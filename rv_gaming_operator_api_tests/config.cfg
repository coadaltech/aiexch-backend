[wallet]
# Operator's wallet base URL (no trailing slash).
# Local dev: backend runs on PORT=3001, staging routes mounted at /qtech-staging/v1
wallet_base_url = http://localhost:3001/qtech-staging/v1

# Api-Key the Platform sends. Must match CASINO_OPERATOR_API_KEY_STAGING in .env.
api_key = dkjfgkusgfuwetfuivwqtcfre7qvtfo7q8

# Player-Session-ID values. The stub treats anything not in the "expired"
# set below as a valid session for debit.
player_session_token = session-token
player_session_token_expired = expired-session-token

# Player ID — any string. Stub auto-creates a 100,000 LKR balance on first
# touch.
player_id = player-id

# These flow through the request payload only; stub does not validate them.
agent_id = 1
game_id = 1
game_name = Teenpatti One Day
game_type = Live
currency = LKR

# Default transaction amount for tests. Initial stub balance is 100,000 so
# the test suite has plenty of headroom.
amount = 1

# ─── Error Testing ────────────────────────────────────────────────────────

# Invalid API key — used to assert INVALID_API_KEY responses.
api_key_invalid = InvalidApiKey

# Amount larger than the stub starting balance — triggers INSUFFICIENT_FUNDS.
amount_insufficient_funds = 9999999

# Blocked player — stub treats this player_id as ACCOUNT_BLOCKED on debit.
blocked_player_id = blocked-player-id
blocked_player_session_token = blocked-player-session-token
